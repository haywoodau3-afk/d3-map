[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "d3map-catalysis"
version = "1.0.0rc1"
description = "Dynamic directional and difference-resolved steric maps for catalytic pockets"
readme = "README.md"
requires-python = ">=3.12"
license = "BSD-3-Clause"
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "mypy>=1.15,<2", "ruff>=0.11,<1"]
gui = ["PySide6>=6.8,<7"]
package = ["pyinstaller>=6.11,<7"]
all = [
  "PySide6>=6.8,<7",
  "pyinstaller>=6.11,<7",
]

[project.scripts]
d3map = "d3map.cli:main"
dmap = "dmap.cli:legacy_main"

[project.gui-scripts]
d3map-gui = "d3map.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dmap.app", "dmap.ml", "dmap.reporting"]
ignore_errors = true
